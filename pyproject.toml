[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-updater"
version = "0.2.4"
description = "Detects, installs, and manually updates the HYDRA-UMC/URTC ecosystem's 46 projects on the machine it runs on (the real CM5, or a dev machine with the same checkout layout)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["hydra-umc", "urtc", "updater", "installer", "fleet-management"]
# The CLI and its safety-critical update core remain stdlib-only. The visual
# desktop shell is optional because a headless CM5 must not need a Qt runtime.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.8,<7"]

[project.urls]
Homepage = "https://github.com/JuanenRac/HYDRA-UMC-UPDATER"

[project.scripts]
hydra-umc-updater = "hydra_umc_updater.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hydra_umc_updater = ["qml/*.qml"]

# Started by hand only (workflow_dispatch): it never runs on a push or a pull request, so it cannot turn the checks of a push red.
#
# Runs tools/signing_chain_check.py: what the image builder signs (the release, the golden image), what the updater verifies and installs (the release, a signed
# model package), and what a simulated bootloader decides about a signed update manifest. The keys are generated in the job and deleted with it; the private key of
# the releases is not available to this workflow and nothing is signed with it. It uploads nothing and publishes nothing.

name: Signing chain (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signing-chain
  cancel-in-progress: false

jobs:
  chain:
    name: Sign, verify and install with throw-away keys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: updater
          persist-credentials: false

      - name: Check out the image builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/HYDRA-UMC-OS-REBUILDER
          path: rebuilder
          persist-credentials: false

      - name: Check out the SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/HYDRA-UMC-SDK
          ref: v0.5.9
          path: sdk
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the chain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install cryptography
          PYTHONDONTWRITEBYTECODE=1 python updater/tools/signing_chain_check.py --rebuilder-src rebuilder/src --sdk-src sdk/clients/python/src | tee "$RUNNER_TEMP/chain.log"
          { echo "### Signing chain with throw-away keys"; echo '```'; cat "$RUNNER_TEMP/chain.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

# Copyright (C) 2026 JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>
# GPL-3.0-or-later - see LICENSE
#
# Runs the real release resolver and the real deployment plan applier against a simulated GitHub API and a simulated device
# with seeded faults (lists that fail or are garbage, tags that point nowhere, steps that are refused, rolled back or fail,
# signatures that stop being valid): no network, no device, no hardware. A second job measures the coverage of the test
# suite and fails under a floor that must not go down.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 3"

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulated releases and device with injected faults
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the updater with the test extras
        run: python -m pip install ".[dev]"
      - name: Run the simulation bench
        run: PYTHONPATH=src python -m pytest tests/test_simulation_bench.py -q

  coverage:
    name: Measure coverage and keep the floor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the updater with the test extras and coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install ".[dev,gui]" coverage
      - name: Run the tests under coverage (statements and branches)
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONPATH=src python -m coverage run --branch --source=src/hydra_umc_updater -m pytest tests -q
      - name: Report the coverage and fail under the floor
        run: python -m coverage report -m --fail-under=78

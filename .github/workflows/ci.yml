name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          lint: mypy
      - name: Updater tests, including the durable promotion journal from the SDK
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install ".[dev,durable-journal,gui]"
          python -m pip install ruff
          ruff check --select E9,F,B src tests tools
          PYTHONPATH=src python -m pytest tests -q
